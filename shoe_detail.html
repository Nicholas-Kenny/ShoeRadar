  <script>
  document.addEventListener("DOMContentLoaded", () => {
      const addToCartBtn = document.querySelector(".add_to_cart");

      if (addToCartBtn) {
          addToCartBtn.addEventListener("click", () => {
              // Ambil UUID asli dari parameter URL (?id=...)
              const params = new URLSearchParams(window.location.search);
              const shoeId = params.get("id");

              if (!shoeId) return alert("Product ID not found!");

              const shoe = {
                  id: shoeId, // Menggunakan UUID Supabase asli
                  name: document.getElementById("detailName").textContent.trim(),
                  category: document.getElementById("detailCategory").textContent.trim(),
                  price: Number(
                      document.getElementById("detailPrice")
                          .textContent
                          .replace("Rp", "")
                          .replace(/\./g, "")
                          .trim()
                  ),
                  image: document.querySelector(".left img").getAttribute("src"),
                  quantity: 1
              };

              let cart = JSON.parse(localStorage.getItem("cart")) || [];
              const existing = cart.find(item => item.id === shoe.id);

              if (existing) {
                  existing.quantity += 1;
              } else {
                  cart.push(shoe);
              }

              localStorage.setItem("cart", JSON.stringify(cart));
              alert(`${shoe.name} added to cart!`);
          });
      }
  });
  </script>
